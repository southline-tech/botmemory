name: Feature request
description: Suggest an improvement to BotOptimizer
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional alternatives you considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Features whose main purpose is storing secrets in Drive-backed notes are **out of scope**. BotOptimizer Memory is not a secrets store.
