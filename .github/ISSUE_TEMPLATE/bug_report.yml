name: Bug report
description: Unexpected behavior in BotOptimizer
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        BotOptimizer Memory is **not** a secrets store. Notes live in Google Drive and are readable to anyone with vault access. **Do not paste** bearer tokens, OAuth secrets, or refresh tokens in this issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BotOptimizer version / commit
      description: Release tag or git SHA.
      placeholder: e.g. v0.1.0 or 98aca025
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - drive
        - memory
        - unsure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS / Go version
      description: Optional.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Redact Bearer tokens and OAuth values before pasting.
    validations:
      required: false
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Security check
      options:
        - label: I did not paste raw tokens or OAuth secrets
    validations:
      required: true
